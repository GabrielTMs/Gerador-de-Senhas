<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de senhas</title>
    <link rel="stylesheet" href="Estilos/main.css">
    <script src="JS/script.js" defer></script>
    <script src="https://kit.fontawesome.com/8125016427.js" crossorigin="anonymous"></script>
</head>
<body>
    <main>
        <div id="imagemTitulo">
            <h1 id="titulo">Seja bem-vindo.</h1>
        </div>
        <div id="conteudoCampo">
            <h2>Crie sua Conta:</h2>
            <hr>
            <p>Registre-se para utilizar todas as funcionalidades do sistema:</p>
            <form method="post" id="formularioCamp">
                <label for="inome">Nome:</label>
                <input type="text" name="nome" id="inome" class="loginInputs">

                <label for="iemail">Email:</label>
                <input type="text" name="email" id="iemail" required class="loginInputs">

                <label for="isenha">Senha:</label>
                <input type="text" name="senha" id="isenha" required class="loginInputs">
            </form>
                
            <p id="geradorParagra">Quer ajuda para criar uma senha segura? <span id="novaSenhaGerador">Clique aqui</span></p>

            <div id="campGeradorSenha" class="esconder">
                <div id="configSenha">
                    <p>Seleciona abaixo, as configurações que deseja que sua senha tenha.</p>
                    <div id="numCaracteres">
                        <label for="isenhaNumb">Quantidade de caracteres</label>
                        <input type="number" name="senhaNumb" id="isenhaNumb" min="8" max="15" placeholder="8">
                    </div>

                    <section class="opcaoCheckbox">
                        <label for="iletras">
                            Letras:
                        </label>
                            <input type="checkbox" name="letras" id="iletras">
                    </section>

                     <section class="opcaoCheckbox">
                         <label for="inumeros">
                            Números: </label>
                            <input type="checkbox" name="numeros" id="inumeros">
                     </section>

                     <section class="opcaoCheckbox">
                         <label for="isimbolos">
                            Símbolos: </label>
                            <input type="checkbox" name="simbolos" id="isimbolos">
                     </section>

                    <button id="criarBTN">Criar senha</button>
                </div>
            </div>

            <div id="senhaResultCamp" class="esconder">
                <p>Sua senha foi gerada abaixo:</p>

                <h3 id="senhaFeita"></h3>

                <button id="copiarBTN">Copiar</button>
            </div>
                
            <label for="iconfirm">Confirmação de senha:</label>
            <input type="text" name="confirm" id="iconfirm" class="loginInputs">

            <input type="submit" value="Cadastrar">
        
        </div>
    </main>
    
</body>
</html>
