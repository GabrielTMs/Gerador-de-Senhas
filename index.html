<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de senhas</title>
    <link rel="stylesheet" href="Estilos/main.css">
    <script src="JS/script.js" defer></script>
</head>
<body>
    <main>
        <div id="imagemTitulo">
            <h1 id="titulo">Seja bem vindo.</h1>
        </div>
        <div id="conteudoCampo">
            <h2>Crie sua Conta:</h2>
            <p>Registre-se para utilizar todas as funcionalidades do sistema</p>
            <form method="post" id="formularioCamp">
                <label for="inome">Nome:</label>
                <input type="text" name="nome" id="inome">

                <label for="iemail">Email:</label>
                <input type="text" name="email" id="iemail" required>

                <label for="isenha">Senha:</label>
                <input type="text" name="senha" id="isenha" required>
            </form>

            <p>Quer ajuda para criar uma senha segura? <span id="novaSenhaGerador">Clique aqui</span></p>
            
            <form method="post" id="confirmaSenhaCamp"></form>
                <label for="iconfirm">Confirmação de senha</label>
                <input type="text" name="confirm" id="iconfirm">

                <input type="submit" value="Cadastrar">
            </form>
        </div>
    </main>
    
</body>
</html>
